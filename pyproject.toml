[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codedna-ai-backend"
version = "0.1.0"
description = "FastAPI backend for the CodeDNA AI engineering governance platform."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.13.2",
    "bcrypt==4.0.1",
    "celery==5.4.0",
    "email-validator==2.2.0",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "openai==1.51.2",
    "passlib[bcrypt]==1.7.4",
    "psycopg[binary]==3.2.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "redis==5.0.8",
    "requests==2.32.3",
    "semgrep==1.87.0",
    "sqlalchemy==2.0.35",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
